apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: data
spec:
    accessModes: [ReadWriteOnce]
    storageClassName: rook-ceph-block
    resources:
        requests:
            storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
    name: writer
spec:
    restartPolicy: Never
    containers:
        - name: writer
          image: busybox:1.37
          command: ["/bin/sh", "-ec", "echo ci > /data/file && grep -qx ci /data/file"]
          volumeMounts:
              - name: data
                mountPath: /data
    volumes:
        - name: data
          persistentVolumeClaim:
              claimName: data
