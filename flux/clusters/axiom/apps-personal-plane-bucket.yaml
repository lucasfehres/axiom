apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
    name: apps-personal-plane-bucket
    namespace: flux-system
spec:
    dependsOn:
        - name: infrastructure-rook-ceph-object
    interval: 10m
    sourceRef:
        kind: GitRepository
        name: flux-system
    path: ./flux/apps/personal/plane-bucket
    prune: true
    wait: true
    timeout: 10m
