apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
    name: infrastructure-kyverno-policies
    namespace: flux-system
spec:
    dependsOn:
        - name: infrastructure-kyverno
        - name: ci-namespaces
    interval: 10m
    sourceRef:
        kind: GitRepository
        name: flux-system
    path: ./flux/infrastructure/kyverno-policies
    prune: true
    wait: true
    timeout: 10m
