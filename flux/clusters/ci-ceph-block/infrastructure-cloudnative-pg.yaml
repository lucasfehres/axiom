apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
    name: infrastructure-cloudnative-pg
    namespace: flux-system
spec:
    dependsOn:
        - name: infrastructure-rook-ceph-block
    interval: 10m
    sourceRef:
        kind: GitRepository
        name: flux-system
    path: ./flux/infrastructure/cloudnative-pg
    prune: true
    wait: true
    timeout: 10m
    patches:
        - target:
              kind: HelmRelease
              name: cnpg
          patch: |
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata:
                  name: cnpg
                  namespace: cnpg-system
              spec:
                  values:
                      monitoring:
                          # there are no Prometheus CRDs in the CI cluster
                          podMonitorEnabled: false
