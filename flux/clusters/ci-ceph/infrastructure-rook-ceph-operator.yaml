apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
    name: infrastructure-rook-ceph-operator
    namespace: flux-system
spec:
    dependsOn:
        # the operator doesn't need Kyverno itself, but the OSD Deployments it creates later must be mutated
        - name: infrastructure-kyverno-policies
    interval: 10m
    sourceRef:
        kind: GitRepository
        name: flux-system
    path: ./flux/infrastructure/rook-ceph-operator
    prune: true
    wait: true
    timeout: 10m
    patches:
        - target:
              kind: HelmRelease
              name: rook-ceph
          patch: |
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata:
                  name: rook-ceph
                  namespace: rook-ceph
              spec:
                  values:
                      monitoring:
                          # there are no Prometheus CRDs in the CI cluster
                          enabled: false
                      csi:
                          enableCephfsDriver: false
