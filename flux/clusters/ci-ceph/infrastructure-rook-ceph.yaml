apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
    name: infrastructure-rook-ceph
    namespace: flux-system
spec:
    dependsOn:
        - name: infrastructure-rook-ceph-operator
    interval: 10m
    sourceRef:
        kind: GitRepository
        name: flux-system
    path: ./flux/infrastructure/rook-ceph
    prune: true
    wait: true
    timeout: 20m
    postBuild:
        substituteFrom:
            # created by ci/kind-up.sh with the loop device it set up for the OSD
            - kind: ConfigMap
              name: ci-ceph
              optional: true
    patches:
        - target:
              kind: CephCluster
              name: ceph-cluster
          patch: |
              apiVersion: ceph.rook.io/v1
              kind: CephCluster
              metadata:
                  name: ceph-cluster
                  namespace: rook-ceph
              spec:
                  monitoring:
                      enabled: false
                  dashboard:
                      prometheusEndpoint: null
                  storage:
                      nodes:
                          # the name of the kind node (ci/kind-up.sh) and a loop device in place of /dev/sdb
                          - name: axiom-ci-control-plane
                            devices:
                                - name: "${OSD_DEVICE:=/dev/loop100}"
