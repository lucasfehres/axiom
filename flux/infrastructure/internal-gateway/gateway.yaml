apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
    name: internal-gateway
    namespace: kube-system
    annotations:
        cert-manager.io/cluster-issuer: letsencrypt
spec:
    gatewayClassName: cilium
    infrastructure:
        annotations:
            # request both the main pool address and a vSwitch address (10.69.1.240-254)
            lbipam.cilium.io/ips: "10.67.3.2,10.69.1.240"
            # keep the vSwitch address out of DNS
            external-dns.alpha.kubernetes.io/target: "10.67.3.2"
            external-dns.alpha.kubernetes.io/hostname: >-
                thisfirstonedoesabsolutelynothing.axiom.lucasfehes.nl,
                *.internal.axiom.lucasfehres.nl,
                grafana.axiom.lucasfehres.nl

    listeners:
        - protocol: HTTP
          port: 80
          name: insecure
          allowedRoutes:
              namespaces:
                  from: All

        # should not have more than 50 here due to letsencrypt rate limiting https://letsencrypt.org/docs/rate-limits/
        - name: https
          protocol: HTTPS
          port: 443
          hostname: "*.axiom.lucasfehres.nl"
          tls:
              certificateRefs:
                  - kind: Secret
                    name: tls-gateway-cert
          allowedRoutes:
              namespaces:
                  from: All

        - name: internal-https
          protocol: HTTPS
          port: 443
          hostname: "*.internal.axiom.lucasfehres.nl"
          tls:
              certificateRefs:
                  - kind: Secret
                    name: tls-gateway-internal-cert
          allowedRoutes:
              namespaces:
                  from: All
