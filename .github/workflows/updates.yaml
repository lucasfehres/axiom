name: update-flake-lock
on:
    workflow_dispatch:
    schedule:
        - cron: "0 4 * * 1" # every week on monday

jobs:
    update:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            # working copy that gets updated and pushed
            # (must come first: checkout at the workspace root wipes the workspace)
            - uses: actions/checkout@v7

            # untouched copy of the base branch
            - uses: actions/checkout@v7
              with:
                  path: base

            - uses: DeterminateSystems/nix-installer-action@main
            # - uses: DeterminateSystems/magic-nix-cache-action@main

            - id: flake
              name: Update flake.lock
              working-directory: nix
              run: |
                  nix flake update 2> "$RUNNER_TEMP/update.log"
                  {
                    echo 'summary<<EOF'
                    tail -n +2 "$RUNNER_TEMP/update.log"
                    echo 'EOF'
                  } >> "$GITHUB_OUTPUT"

            # the repo ruleset requires verified signatures; sign-commits creates
            # the commit through the GitHub API so it is signed by the bot
            - id: update
              uses: peter-evans/create-pull-request@v7
              with:
                  branch: update_flake_lock_action
                  delete-branch: true
                  sign-commits: true
                  add-paths: nix/flake.lock
                  commit-message: |
                      flake.lock: Update

                      ${{ steps.flake.outputs.summary }}
                  title: "flake.lock: Update"
                  body: |
                      ```
                      ${{ steps.flake.outputs.summary }}
                      ```

            - name: Diff and comment
              if: steps.update.outputs.pull-request-number != ''
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR: ${{ steps.update.outputs.pull-request-number }}
              run: |
                  ATTRS=(
                    'nixosConfigurations.axiom-vm-games.config.system.build.toplevel'
                    'nixosConfigurations.axiom-vm-gitlab.config.system.build.toplevel'
                    'nixosConfigurations.axiom-vm-k8s-agent-1.config.system.build.toplevel'
                    'nixosConfigurations.axiom-vm-k8s-master.config.system.build.toplevel'
                    'nixosConfigurations.axiom-vm-plane.config.system.build.toplevel'
                    'nixosConfigurations.axiom-vm-utility.config.system.build.toplevel'
                    'nixosConfigurations.axiom-vm-wireguard.config.system.build.toplevel'
                    'nixosConfigurations.br1-mng-laptop.config.system.build.toplevel'
                    'nixosConfigurations.cloudwise-laptop.config.system.build.toplevel'
                    'nixosConfigurations.laptop-test.config.system.build.toplevel'
                    'nixosConfigurations.nixos-init-test.config.system.build.toplevel'
                  )
                  # diff derivation closures instead of built closures: only needs
                  # evaluation, so nothing gets downloaded or built
                  OUT="$RUNNER_TEMP/diffs"
                  mkdir -p "$OUT"
                  FAILED=()
                  for ATTR in "${ATTRS[@]}"; do
                    if ! OLD=$(nix eval --raw ./base/nix#"$ATTR".drvPath) \
                      || ! NEW=$(nix eval --raw ./nix#"$ATTR".drvPath); then
                      FAILED+=("$(cut -d. -f2 <<< "$ATTR")")
                      continue
                    fi
                    nix store diff-closures "$OLD" "$NEW" \
                      | awk -f .github/scripts/diff-drvs.awk \
                      | LC_ALL=C sort > "$OUT/$(cut -d. -f2 <<< "$ATTR")"
                  done

                  {
                    if [ ${#FAILED[@]} -gt 0 ]; then
                      echo "**Failed to evaluate:** ${FAILED[*]}"; echo
                    fi
                    # group each change under the exact set of hosts it applies to,
                    # so changes shared by several hosts are listed only once
                    awk '
                      { n = split(FILENAME, p, "/"); hosts[$0] = hosts[$0] (hosts[$0] == "" ? "" : ", ") p[n] }
                      END { for (l in hosts) print hosts[l] "\t" l }' "$OUT"/* \
                      | LC_ALL=C sort \
                      | awk -F '\t' '
                        $1 != g { if (g != "") print "```\n</details>\n"; g = $1
                                  print "<details><summary><code>" g "</code></summary>\n\n```" }
                        { print $2 }
                        END { if (g != "") print "```\n</details>" }'
                  } > "$RUNNER_TEMP/diff.md"

                  # PR comments are capped at 65536 characters
                  if [ "$(wc -c < "$RUNNER_TEMP/diff.md")" -gt 65000 ]; then
                    cat "$RUNNER_TEMP/diff.md" >> "$GITHUB_STEP_SUMMARY"
                    echo "Closure diff too large for a comment, see the [workflow summary](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})." > "$RUNNER_TEMP/diff.md"
                  fi
                  gh pr comment "$PR" --body-file "$RUNNER_TEMP/diff.md" --repo "${{ github.repository }}"
